name: Test and release Type Strike

on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: type-strike-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test game rules and build JAR
        shell: pwsh
        run: ./test.ps1
      - name: Package source and Windows game
        shell: pwsh
        run: python tools/package_release.py
      - name: Publish version tag and game files
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const crypto = require('crypto');
            const version = fs.readFileSync('VERSION', 'utf8').trim();
            if (!/^\d+\.\d+\.\d+$/.test(version)) throw new Error('Invalid version');
            const tag = `v${version}`;
            const repo = context.repo;
            // เก็บรุ่นที่เผยแพร่แล้วไว้ตามเดิม ไม่เขียนทับ Release ที่มีอยู่
            let existing;
            try { existing = await github.rest.repos.getReleaseByTag({...repo, tag}); }
            catch (error) { if (error.status !== 404) throw error; }
            if (existing) throw new Error(`Release ${tag} already exists; choose a new version`);
            const files = [
              [`TypeStrike-${tag}.jar`, 'dist/TypeStrike.jar', 'application/java-archive'],
              [`TypeStrike-${tag}-Windows.zip`, `release/TypeStrike-${tag}-Windows.zip`, 'application/zip'],
              [`TypeStrike-${tag}-Source.zip`, `release/TypeStrike-${tag}-Source.zip`, 'application/zip'],
              ['CHANGELOG.md', 'CHANGELOG.md', 'text/markdown']
            ];
            for (const name of ['menu', 'gameplay', 'pause']) {
              const path = `screenshots/${name}.png`;
              if (fs.existsSync(path)) files.push([`${name}.png`, path, 'image/png']);
            }
            const sums = files.map(([name,path]) => `${crypto.createHash('sha256').update(fs.readFileSync(path)).digest('hex')}  ${name}\n`).join('');
            fs.writeFileSync('release/SHA256SUMS.txt', sums);
            files.push(['SHA256SUMS.txt', 'release/SHA256SUMS.txt', 'text/plain']);
            const body = version === '1.2.0'
              ? 'Adds Blast Slime (area damage and chain reactions) and Healer Slime (one nearby armor restoration every 8 seconds, with a warning). Keeps the existing pace, 5-second Slow, 3 charges and pause menu.\n\nRequires Java 21+. Extract the Windows ZIP and open Play.cmd. Source ZIP contains game files only. Academic documents and the separate family game remain local.\n\nValidation: game rules, Slow, difficulty balance and special-enemy integration tests pass on Java 21.'
              : version === '1.3.0'
              ? 'Redesigns the main menu around the owner\'s sketch: centered title/actions, sprites below, local top-three scores with medal icons at bottom left and a compact how-to-play card at bottom right. Moves HP to the upper left and removes the enemy counter and repeated instructions. Adds looping menu/battle music by HydroGene (CC0) and a working Mute/Unmute Music button in Pause.\n\nGameplay rules remain the same as v1.2.0. The existing placeholder sprites are retained for the later art stage. Music stops while paused and the mute choice persists across screens/runs until the app closes.\n\nRequires Java 21+. Extract the Windows ZIP and open Play.cmd. Includes bundled music and credits. Source, screenshots, playable JAR and SHA256 checksums attached. Gameplay, balance, special-enemy and audio tests pass on Java 21.'
              : version === '1.4.0'
              ? 'Adds bundled DungeonTileset II v1.7 art by 0x72 (CC0): animated wizard and enemies, dungeon floor/wall backgrounds for the menu and arena, and menu columns/banners. Enemy palette variants and armor/crystal/fuse/healer markers keep all five types distinct. Uses nearest-neighbor scaling and caches resources/backgrounds. Gameplay animation stops with game time on Pause.\n\nPreserves the v1.3.0 UI, music/mute controls and gameplay rules. Background walls are decorative and do not change collisions. Java 21+, offline play; extract the Windows ZIP and open Play.cmd. Source, screenshots, JAR and SHA256 checksums included. Art and music credits are bundled.\n\nValidation: gameplay, Slow, difficulty, special-enemy, music and bundled-art tests pass on Java 21; UI reviewed at normal and minimum window sizes.'
              : version === '1.4.1'
              ? 'Updates buttons and typography to match the dungeon pixel art. Adds stone-bevel buttons with hover, pressed, keyboard-focus and disabled states. Bundles Pixelify Sans under SIL OFL 1.1 for menu, HUD, typing and enemy words; no system font installation required.\n\nPreserves the existing layout, music and gameplay. Requires Java 21+: extract the Windows ZIP and open Play.cmd. Font copyright/license is included in the source, JAR and Windows package. Includes current screenshots and SHA256 checksums.\n\nValidation: gameplay, music and art tests pass; UI controls and text fit checked at normal/minimum window sizes.'
              : version === '1.4.2'
              ? 'Uses the owner-selected enemy roster: Normal Orc Warrior, Armored Masked Orc, Frost Ice Zombie, Blast Imp and Healer Orc Shaman. Enlarges visible bodies while preserving pixel proportions, uses four-frame movement animations, and moves word/status labels clear of larger sprites.\n\nKeeps existing gameplay, collision rules, UI, music and pixel buttons/fonts. Art by 0x72 (CC0); credits and original PNGs bundled. Requires Java 21+: extract the Windows ZIP and open Play.cmd. Includes source, screenshots, playable JAR and SHA256 checksums.\n\nGameplay, music, art and UI interaction tests pass; layouts reviewed at normal/minimum window sizes.'
              : version === '1.4.3'
              ? 'Enlarges only the player sprite in the main-menu character row to balance it with the selected enemies. Keeps its center/feet aligned and preserves the gameplay player size, enemy roster, layout, music and rules.\n\nJava 21+: extract the Windows ZIP and open Play.cmd. Source, screenshots, playable JAR, bundled assets/licenses and SHA256 checksums included. Menu reviewed at normal/minimum window sizes; game tests pass.'
              : version === '1.4.4'
              ? 'Places the main-menu wizard centered above a separate row of all five enemies. Reduces both menu and battle music sample amplitude by 30% relative to v1.4.3, including devices without hardware gain. Existing mute/pause behavior remains. Sound effects are not yet implemented.\n\nPreserves gameplay rules and in-game sprite sizes. Requires Java 21+: extract the Windows ZIP and open Play.cmd. Includes source, screenshots, JAR, asset/font licenses and SHA256 checksums. Gameplay/audio tests pass; menu reviewed at normal/minimum sizes.'
              : version === '1.4.5'
              ? 'Switches to the owner-selected VT323 font (option B) throughout the menu, buttons, HUD, enemy words and typing input. Adjusts display sizes for VT323\'s smaller letter height and bundles its unchanged font, copyright and SIL OFL 1.1 license. No font installation required.\n\nPreserves layout, sprites, gameplay and the previously reduced music volume. Java 21+: extract the Windows ZIP and open Play.cmd. Includes source, current screenshots, JAR, licenses and SHA256 checksums. Gameplay/audio/art tests pass; font loading, text fit and UI interactions verified at normal/minimum sizes.'
              : version === '1.5.0'
              ? 'Adds five owner-selected Kenney sound effects with separate Music/SFX mute controls. Masked Orc becomes Orc Warrior when armor breaks and returns when healed. Removes enemy type overlays and thin arena frames. Adds the selected J Rune Dome, R2 gold/silver/bronze crowns and adjusts the wizard to rest on the dome base. Uses Pixelify Sans throughout with concise instructions that fit small windows.\n\nPreserves HP, collision, difficulty, enemy abilities and 5-second Slow with 3 charges. Custom dome/crown artwork was created with ImageGen; source and asset credits are bundled.\n\nRequires Java 21+. Extract the Windows ZIP and open Play.cmd. Includes JAR, game-only source, Windows package, current screenshots, CHANGELOG.md for all released versions and local previews, and SHA256 checksums. Rule/audio/art tests pass; UI reviewed at normal and minimum sizes.\n\n[Version history](https://github.com/s6604062610241-hue/Type-Strike/blob/main/CHANGELOG.md)'
              : 'Java 21 typing defense game. Extract the Windows ZIP and open Play.cmd. Source, playable JAR and SHA256 checksums attached. Game rules tested before packaging.';
            const release = await github.rest.repos.createRelease({...repo, tag_name: tag, target_commitish: context.sha,
              name: `Type Strike ${tag}`, body, draft: true});
            for (const [name,path,type] of files) {
              const data = fs.readFileSync(path);
              await github.rest.repos.uploadReleaseAsset({...repo, release_id: release.data.id, name,
                data, headers: {'content-type':type, 'content-length':data.length}});
            }
            const uploaded = await github.rest.repos.listReleaseAssets({...repo, release_id: release.data.id});
            for (const [name,path] of files) {
              const asset = uploaded.data.find(asset => asset.name === name);
              if (!asset || asset.size !== fs.statSync(path).size) throw new Error(`Asset verification failed: ${name}`);
            }
            await github.rest.repos.updateRelease({...repo, release_id: release.data.id, draft:false, make_latest:'true'});
